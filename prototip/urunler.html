<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Takibi</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Ürün Takibi</h1>

    <form id="urun-formu">
      <div>
        <label for="marka">Marka</label>
        <input type="text" id="marka" name="marka" placeholder="Ülker" required>
      </div>

      <div>
        <label for="urun-adi">Ürün adı</label>
        <input type="text" id="urun-adi" name="urun_adi" placeholder="Çikolata" required>
      </div>

      <div>
        <label for="cesit">Çeşit</label>
        <input type="text" id="cesit" name="cesit" placeholder="Sütlü" required>
      </div>

      <div>
        <label for="birim">Birim</label>
        <select id="birim" name="birim" required>
          <option value="g">Gram (g)</option>
          <option value="ml">Mililitre (ml)</option>
          <option value="adet">Adet</option>
        </select>
      </div>

      <div>
        <label for="miktar">Paket miktarı</label>
        <input type="number" id="miktar" name="miktar" min="0.01" step="0.01" placeholder="80" required>
      </div>

      <div>
        <label for="fiyat">Etiket fiyatı (TL)</label>
        <input type="number" id="fiyat" name="fiyat" min="0.01" step="0.01" placeholder="40" required>
      </div>

      <div>
        <label for="tarih">Tarih</label>
        <input type="date" id="tarih" name="tarih" required>
      </div>

      <button type="submit">Kaydet</button>
    </form>

    <p id="sonuc"></p>

    <h2>Fiyat kayıtları</h2>
    <ul id="kayit-listesi"></ul>

    <script src="analiz.js"></script>
    <script src="urun.js"></script>
  </body>
</html>
